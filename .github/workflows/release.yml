name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # The version the lockfile was written with.
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: End-to-end (CLI flows)
        run: bun run test:e2e

      - name: Build
        run: bun run build

      # The registry name `10x-chat` belongs to the upstream project, so
      # `npm publish` fails and would block the GitHub Release. Publishing is
      # disabled until a free name is chosen (docs/verification.md §4).
      - name: Publish to npm
        if: false
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
