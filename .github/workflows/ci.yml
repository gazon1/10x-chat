name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # The version the lockfile was written with.
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      # The CLI scenarios of the end-to-end suite: no browser, no login, no
      # secrets — they only start the CLI in a throwaway data directory.
      - name: End-to-end (CLI flows)
        run: bun run test:e2e

      - name: Build
        run: bun run build
