name: E2E (live providers)

# Opt-in. The live scenarios need a browser and a logged-in provider profile,
# so they never run on a push: a human starts them from the Actions tab.
# No repository secret is used — the logins live in the browser profile of the
# runner, not in the repository.
on:
  workflow_dispatch:
    inputs:
      providers:
        description: 'Providers to test (comma separated, empty = all)'
        required: false
        default: ''
      chatgpt_use:
        description: 'Run the live scenario of the ChatGPT backend (1 = yes, needs chatgpt-use on the runner)'
        required: false

jobs:
  live:
    # The runner holds the logged-in profiles (~/.10x-chat by default).
    runs-on: [self-hosted, linux, 10x-chat-e2e]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Live provider scenarios
        env:
          # `1` runs every provider, a comma separated list runs only those.
          TEN_X_CHAT_E2E_PROVIDERS: ${{ inputs.providers || '1' }}
          # `1` runs the live scenario of the ChatGPT backend — the runner
          # needs the `chatgpt-use` CLI and a logged-in ChatGPT.
          TEN_X_CHAT_E2E_CHATGPT_USE: ${{ inputs.chatgpt_use }}
        run: bun run test:e2e
